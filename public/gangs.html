<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gangs — GBR·HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sb-brand"><b style="font-family:'Archivo Black',sans-serif;">GBR·HUB</b></div>
    <nav class="sb-nav">
      <a class="sb-link" href="/dashboard.html">Dashboard</a>
      <a class="sb-link" href="/inhouse.html">InHouse</a>
      <a class="sb-link" href="/events.html">Events</a>
      <a class="sb-link active" href="/gangs.html">Gangs</a>
    </nav>
    <div class="sb-user">
      <img class="sb-avatar" data-user-avatar alt="">
      <div class="sb-user-info"><b data-user-name>...</b><small>via Discord OAuth</small></div>
    </div>
    <button class="sb-logout" onclick="logout()">Sair</button>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><div class="topbar-title">Gangs</div><div class="topbar-sub">Ranking real, atualizado pelas InHouse.</div></div>
    </div>
    <div class="content">

      <div id="createBox" style="display:none;">
        <div class="panel-head" style="border:none;padding:0 0 14px;"><h3>Criar sua gang</h3></div>
        <div class="form-row">
          <input type="text" id="gangNameInput" placeholder="Nome da gang" maxlength="24">
          <button class="btn btn-primary" onclick="createGang()">Criar</button>
        </div>
      </div>

      <div class="panel-head" style="border:none;padding:0 0 16px;"><h3>Ranking geral</h3></div>
      <div id="gangsList"><div class="empty">Carregando...</div></div>
    </div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
let uid = null, myGangId = null;

async function loadGangs(){
  const data = await api('gangs');
  uid = data.userId; myGangId = data.userGangId;

  document.getElementById('createBox').style.display = myGangId ? 'none' : 'block';

  document.getElementById('gangsList').innerHTML = data.gangs.length ? data.gangs.map((g, i) => {
    const souMembro = g.members.includes(uid);
    return `
      <div class="gang-row">
        <div class="gang-rank">${String(i+1).padStart(2,'0')}</div>
        <div class="gang-info">
          <div style="font-family:'Archivo Black',sans-serif;font-size:15px;">${g.name}</div>
          <small>${g.members.length} membro${g.members.length!==1?'s':''}</small>
        </div>
        <div class="gang-pts">${g.points} pts</div>
        ${souMembro
          ? `<button class="btn btn-ghost btn-sm" onclick="leaveGang()">Sair</button>`
          : (myGangId ? '' : `<button class="btn btn-ghost btn-sm" onclick="joinGang('${g.id}')">Entrar</button>`)
        }
      </div>
    `;
  }).join('') : `<div class="empty">Nenhuma gang criada ainda. Seja o primeiro!</div>`;
}

async function createGang(){
  const name = document.getElementById('gangNameInput').value;
  try{ await api('gangs', {method:'POST', body: JSON.stringify({action:'create', name})}); toast('Gang criada!','ok'); loadGangs(); }
  catch(e){ toast(e.message,'error'); }
}
async function joinGang(gangId){
  try{ await api('gangs', {method:'POST', body: JSON.stringify({action:'join', gangId})}); toast('Você entrou na gang.','ok'); loadGangs(); }
  catch(e){ toast(e.message,'error'); }
}
async function leaveGang(){
  try{ await api('gangs', {method:'POST', body: JSON.stringify({action:'leave'})}); toast('Você saiu da gang.','ok'); loadGangs(); }
  catch(e){ toast(e.message,'error'); }
}

(async function(){
  const user = await requireSession();
  if(!user) return;
  await loadGangs();
})();
</script>
</body>
</html>
